<!--
  In-app changelog template (see ../guidelines/changelog.md for the requirements this implements).

  Self-contained: no build step, no external dependencies, no webfonts. The palette below is
  deliberately neutral — it is a starting point to replace, not a look to keep.

  ============================================================================================
  ADAPT to the project (expected, do all of these)
  ----------------------------------------------------------------------------------------
  · Every token in the APP THEME block: surfaces, ink, lines, accent, radius, type stacks.
    Swap them for the app's real design tokens in all three places (`:root`, the
    prefers-color-scheme block, and both `[data-theme]` blocks).
  · The masthead: brand name, headline, and the lede sentence.
  · CHANGELOG_ENDPOINT / VERSIONS_ENDPOINT — point them at the app's real routes (contract in
    the API CONTRACT comment below), then delete DEMO_DATA and its two fallback branches.
  · Spacing, radius and shadow to match the app's other surfaces.

  KEEP (these carry meaning or behavior — changing them breaks the view)
  ----------------------------------------------------------------------------------------
  · Four distinct category colors. Re-pick the hues freely, but --added / --changed / --fixed
    / --removed must stay mutually distinguishable, readable on the card surface in both
    themes, and distinct from --accent (which marks versions, not categories). Each category's
    color must stay the same wherever that category appears — heading swatch, card edge, chip.
  · --mark must stay clearly distinct from all four category colors and from --accent, or a
    search highlight starts reading as a category. Its contrast against --mark-ink is what
    makes highlighted text legible.
  · Both themes. The `[data-theme]` blocks must keep overriding the media query in both
    directions, or the app's own theme toggle stops working here.
  · Card anatomy and reading order: summary → (description when open) → tags, tags in the
    order version, category, ticket. The disclosure arrow follows the summary text and points
    sideways when collapsed, down when open.
  · Heading logic: headings disappear while a search is active, and version headings also
    disappear while a version filter narrows the list — in both cases the cards' own tags
    already carry that information.
  · The grouping toggle, search-with-highlight, version range filter and cursor pagination —
    these are the requirements this template exists to satisfy.
  ============================================================================================
-->
<title>Changelog</title>
<style>
  /* ---------------- APP THEME — replace these with the app's real tokens ---------------- */
  :root {
    --paper: #fcfcfd;
    --ink: #17191c;
    --ink-soft: #53585f;
    --ink-faint: #868b93;
    --line: #e3e5e9;
    --card: #ffffff;
    --field: #f2f3f6;
    --accent: #4a5a70;
    --accent-ink: #3b4859;
    --added: #2f7150;
    --changed: #8a6a24;
    --fixed: #2c637f;
    --removed: #8f3f48;
    --mark: #ffe9a8;
    --mark-ink: #4a3a08;
    --shadow: 0 1px 2px rgba(20, 24, 30, 0.04), 0 8px 28px rgba(20, 24, 30, 0.06);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #131519; --ink: #e7e9ec; --ink-soft: #a3a8b0; --ink-faint: #6f757e;
      --line: #272a30; --card: #1a1d22; --field: #1f232a;
      --accent: #93a4bb; --accent-ink: #a7b6c9;
      --added: #6cba8c; --changed: #cba55f; --fixed: #6aa9c6; --removed: #cf8590;
      --mark: #5c4a12; --mark-ink: #f7e9c0;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="light"] {
    --paper: #fcfcfd; --ink: #17191c; --ink-soft: #53585f; --ink-faint: #868b93;
    --line: #e3e5e9; --card: #ffffff; --field: #f2f3f6;
    --accent: #4a5a70; --accent-ink: #3b4859;
    --added: #2f7150; --changed: #8a6a24; --fixed: #2c637f; --removed: #8f3f48;
    --mark: #ffe9a8; --mark-ink: #4a3a08;
    --shadow: 0 1px 2px rgba(20,24,30,.04), 0 8px 28px rgba(20,24,30,.06);
  }
  :root[data-theme="dark"] {
    --paper: #131519; --ink: #e7e9ec; --ink-soft: #a3a8b0; --ink-faint: #6f757e;
    --line: #272a30; --card: #1a1d22; --field: #1f232a;
    --accent: #93a4bb; --accent-ink: #a7b6c9;
    --added: #6cba8c; --changed: #cba55f; --fixed: #6aa9c6; --removed: #cf8590;
    --mark: #5c4a12; --mark-ink: #f7e9c0;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }

  /* ---------------- structure (adjust freely; the tokens above drive the look) ---------------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: clamp(1.75rem, 5vw, 3.5rem) clamp(1.15rem, 5vw, 2rem) 5rem;
  }

  /* Masthead */
  .brand {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: var(--mono);
    font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .brand .dot { color: var(--accent); font-size: 1rem; line-height: 0; }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(2rem, 6vw, 2.8rem);
    line-height: 1.08;
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0.9rem 0 0.55rem;
  }
  .lede { margin: 0; max-width: 58ch; font-size: 1.05rem; color: var(--ink-soft); }

  /* Controls */
  .controls {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; gap: 0.6rem;
    margin: 2rem 0 0;
    padding: 0.9rem 0;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .search {
    flex: 1 1 14rem; min-width: 0;
    padding: 0.5rem 0.8rem;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--field); color: var(--ink);
    font: inherit; font-size: 0.95rem;
  }
  .search::placeholder { color: var(--ink-faint); }
  .search:focus-visible, .range select:focus-visible, .sort button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .range {
    display: flex; align-items: center; gap: 0.4rem;
    font-family: var(--mono); font-size: 0.72rem;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint);
  }
  .range select {
    padding: 0.4rem 0.5rem;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--field); color: var(--ink);
    font-family: var(--mono); font-size: 0.78rem;
    font-variant-numeric: tabular-nums;
    text-transform: none; letter-spacing: 0;
  }
  .sort {
    display: flex; align-items: center; gap: 0.4rem;
    font-family: var(--mono); font-size: 0.72rem;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint);
  }
  .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--field); padding: 2px; }
  .sort button {
    appearance: none; border: 0; cursor: pointer;
    padding: 0.3rem 0.7rem; border-radius: 999px;
    background: transparent; color: var(--ink-soft);
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .sort button[aria-pressed="true"] {
    background: var(--card); color: var(--accent-ink);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
  }

  /* Group headings */
  .group { margin: 2.2rem 0 0; }
  .group:first-child { margin-top: 1.6rem; }
  .group-head {
    display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem 0.8rem;
    margin-bottom: 0.85rem;
  }
  .group-head .ver {
    display: inline-flex; align-items: baseline;
    padding: 0.22rem 0.64rem;
    border: 1px solid var(--accent); border-radius: 999px;
    color: var(--accent-ink);
    font-family: var(--mono); font-size: 0.8rem; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .group-head .date {
    font-family: var(--mono); font-size: 0.76rem; color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .group-head .swatch {
    width: 0.62rem; height: 0.62rem; border-radius: 3px; flex: none;
    background: var(--gcol);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--gcol) 16%, transparent);
  }
  .group-head h2 {
    font-family: var(--serif); font-weight: 600; font-size: 1.25rem;
    letter-spacing: -0.005em; margin: 0;
  }
  .group-head .count {
    margin-left: auto;
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em;
    color: var(--ink-faint); font-variant-numeric: tabular-nums;
  }

  /* Cards */
  ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.55rem; }
  li.item {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--gcol);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  li.item > details > summary {
    list-style: none; cursor: pointer;
    padding: 0.75rem 1rem 0.45rem;
  }
  li.item > details > summary::-webkit-details-marker { display: none; }
  summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--radius); }
  .summary-text {
    font-size: 0.99rem; font-weight: 600; color: var(--ink); text-wrap: pretty;
  }
  /* Disclosure arrow rides along with the text: horizontal when collapsed, down when open. */
  .summary-text::after {
    content: ""; display: inline-block;
    width: 0.42em; height: 0.42em;
    margin-left: 0.5em; vertical-align: 0.12em;
    border-right: 1.6px solid var(--ink-faint);
    border-bottom: 1.6px solid var(--ink-faint);
    transform: rotate(-45deg);
    transition: transform 140ms ease;
  }
  details[open] .summary-text::after { transform: rotate(45deg); }
  .body {
    margin: 0; padding: 0 1rem 0.15rem;
    font-size: 0.95rem; color: var(--ink-soft); max-width: 62ch;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 0.28rem; padding: 0.4rem 1rem 0.75rem; }
  .chip {
    font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.04em;
    line-height: 1.5; padding: 0.06rem 0.38rem;
    border-radius: 5px; white-space: nowrap;
  }
  .chip-ver {
    color: var(--accent-ink);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
    font-variant-numeric: tabular-nums;
  }
  .chip-type {
    text-transform: uppercase; font-weight: 600;
    color: var(--gcol);
    background: color-mix(in srgb, var(--gcol) 13%, transparent);
    border: 1px solid color-mix(in srgb, var(--gcol) 32%, transparent);
  }
  .chip-ticket {
    color: var(--ink-faint);
    background: transparent;
    border: 1px solid var(--line);
  }
  mark { background: var(--mark); color: var(--mark-ink); border-radius: 3px; padding: 0 0.12em; }

  .status {
    margin: 2.5rem 0 0; text-align: center;
    font-family: var(--mono); font-size: 0.76rem; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .sentinel { height: 1px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<div class="wrap">
  <header>
    <span class="brand"><span class="dot">●</span> <span class="brand-name">Your app</span></span>
    <h1>Changelog</h1>
    <p class="lede">Everything that changed, newest first. Search it, narrow it to a release or a span of them, and open any entry for the full story.</p>
  </header>

  <div class="controls">
    <input class="search" type="search" placeholder="Search changes…" aria-label="Search changelog" />
    <div class="range">
      from <select class="version-from" aria-label="From version"></select>
      to <select class="version-to" aria-label="To version"></select>
    </div>
    <div class="sort">
      group
      <span class="segmented">
        <button type="button" data-sort="version" aria-pressed="true">Version</button>
        <button type="button" data-sort="type" aria-pressed="false">Type</button>
      </span>
    </div>
  </div>

  <div class="groups"></div>
  <p class="status" hidden></p>
  <div class="sentinel"></div>
</div>

<script>
(function () {
  "use strict";

  /* =========================================================================================
   * API CONTRACT — replace these two endpoints with the app's real backend routes.
   *
   * GET {VERSIONS_ENDPOINT}
   *   -> { "versions": ["1.0.0", "1.1.0", "1.2.0", ...] }   // ascending, used to fill the
   *      from/to <select> filters without loading every entry up front.
   *
   * GET {CHANGELOG_ENDPOINT}?cursor=<opaque|omit for first page>&limit=<n>
   *                          &search=<optional>&versionFrom=<optional>&versionTo=<optional>
   *   -> {
   *        "releases": [
   *          { "version": "1.4.0", "date": "2026-07-01", "entries": [
   *              { "type": "added" | "changed" | "fixed" | "removed",
   *                "ticket": "FEAT-042",
   *                "summary": "One line, shown collapsed.",
   *                "description": "The full explanation, shown when expanded." }
   *          ] }
   *        ],
   *        "nextCursor": "opaque-string-or-null"   // null/absent means no more pages
   *      }
   *   Releases are returned newest-first. Filtering/search happens server-side so pagination
   *   and bandwidth savings hold even with an active filter; the client re-filters and
   *   highlights locally so matches are visible without a second round trip.
   * ========================================================================================= */
  var CHANGELOG_ENDPOINT = "/api/changelog";
  var VERSIONS_ENDPOINT = "/api/changelog/versions";
  var PAGE_SIZE = 10;
  var SEARCH_DEBOUNCE_MS = 250;

  var TYPES = ["added", "changed", "fixed", "removed"];
  var TYPE_LABEL = { added: "Added", changed: "Changed", fixed: "Fixed", removed: "Removed" };

  // Demo data so the template is inspectable before the endpoints exist. Delete once wired up.
  var DEMO_DATA = {
    versions: ["1.0.0", "1.1.0", "1.2.0"],
    releases: [
      { version: "1.2.0", date: "2026-07-20", entries: [
        { type: "added", ticket: "FEAT-031", summary: "Offline map regions",
          description: "Pre-download a named area or draw your own. You get a size estimate before it starts and a progress bar while it runs, and the tile count is capped so a stray selection can't fill your storage." },
        { type: "added", ticket: "FEAT-034", summary: "Data freshness at a glance",
          description: "The map header shows when its data was last updated, with a refresh action that appears once the server has something newer." },
        { type: "changed", ticket: "FEAT-028", summary: "Search ranks by distance first",
          description: "Nearby results now come before exact name matches, which is what you actually want while standing somewhere looking for the closest one." },
        { type: "fixed", ticket: "BUG-014", summary: "Clustering no longer flickers while zooming",
          description: "Markers were being rebuilt on every zoom step instead of having their icons swapped in place. They now update without tearing down the layer." },
        { type: "removed", ticket: "FEAT-036", summary: "Retired the legacy bookmark sync",
          description: "The old sync endpoint has been off since 1.1.0 and its client code is now gone. Existing bookmarks were migrated on first launch of 1.1.0 and are unaffected." }
      ]},
      { version: "1.1.0", date: "2026-06-02", entries: [
        { type: "added", ticket: "FEAT-019", summary: "Dark mode everywhere",
          description: "Every view follows your system theme, with a manual override in settings for when you want to pin one." },
        { type: "changed", ticket: "FEAT-022", summary: "Favourites moved into the bottom sheet",
          description: "They used to live behind the settings menu, which meant three taps to reach the thing you look at most." },
        { type: "fixed", ticket: "BUG-009", summary: "Settings open offline again",
          description: "The settings screen tried to read the remote config before falling back to the cached copy, so it crashed with no connection instead of showing what it already had." }
      ]},
      { version: "1.0.0", date: "2026-05-01", entries: [
        { type: "added", ticket: "FEAT-001", summary: "First release",
          description: "Map, search, favourites and offline support." }
      ]}
    ]
  };

  var groupsEl = document.querySelector(".groups");
  var statusEl = document.querySelector(".status");
  var sentinelEl = document.querySelector(".sentinel");
  var searchEl = document.querySelector(".search");
  var fromEl = document.querySelector(".version-from");
  var toEl = document.querySelector(".version-to");
  var sortBtns = Array.prototype.slice.call(document.querySelectorAll(".sort button"));

  var versionList = [];
  var openKeys = new Set();   // cards the user expanded — survives re-render
  var state = {
    cursor: null, loading: false, done: false,
    search: "", versionFrom: "", versionTo: "", sort: "version",
    items: []   // flat {version, date, entry}, in server order (newest release first)
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function highlight(text, term) {
    var safe = escapeHtml(text || "");
    if (!term) return safe;
    var esc = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return safe.replace(new RegExp("(" + esc + ")", "ig"), "<mark>$1</mark>");
  }

  function hit(text, term) {
    return !!term && String(text || "").toLowerCase().indexOf(term.toLowerCase()) !== -1;
  }

  function matches(entry, term) {
    if (!term) return true;
    return hit(entry.summary, term) || hit(entry.description, term) || hit(entry.ticket, term);
  }

  function keyOf(item) {
    return item.version + "|" + (item.entry.ticket || "") + "|" + item.entry.summary;
  }

  function renderCard(item, term) {
    var e = item.entry;
    var key = keyOf(item);
    // Open when the user opened it, or when the match is only in the collapsed description.
    var open = openKeys.has(key) || (term && hit(e.description, term) && !hit(e.summary, term));
    return (
      '<li class="item" style="--gcol: var(--' + e.type + ')" data-key="' + escapeHtml(key) + '">' +
        "<details" + (open ? " open" : "") + ">" +
          '<summary><span class="summary-text">' + highlight(e.summary, term) + "</span></summary>" +
          '<p class="body">' + highlight(e.description, term) + "</p>" +
        "</details>" +
        '<div class="tags">' +
          '<span class="chip chip-ver">v' + escapeHtml(item.version) + "</span>" +
          '<span class="chip chip-type">' + TYPE_LABEL[e.type] + "</span>" +
          (e.ticket ? '<span class="chip chip-ticket">' + highlight(e.ticket, term) + "</span>" : "") +
        "</div>" +
      "</li>"
    );
  }

  function section(headHtml, items, term, gcol) {
    var el = document.createElement("section");
    el.className = "group";
    if (gcol) el.style.setProperty("--gcol", "var(--" + gcol + ")");
    el.innerHTML = headHtml +
      '<ul class="items">' + items.map(function (i) { return renderCard(i, term); }).join("") + "</ul>";
    return el;
  }

  function render() {
    var term = state.search;
    var visible = state.items.filter(function (i) { return matches(i.entry, term); });
    groupsEl.innerHTML = "";

    if (!visible.length) {
      setStatus(term || state.versionFrom || state.versionTo ? "No matching changes" : "Nothing here yet");
      return;
    }

    // A search scatters results across the whole history, so the grouping headings stop
    // helping — every card carries its own version and category tags either way.
    var withHeadings = !term;

    if (state.sort === "type") {
      TYPES.forEach(function (type) {
        var ofType = visible.filter(function (i) { return i.entry.type === type; });
        if (!ofType.length) return;
        var head = withHeadings
          ? '<div class="group-head"><span class="swatch"></span><h2>' + TYPE_LABEL[type] +
            '</h2><span class="count">' + ofType.length + "</span></div>"
          : "";
        groupsEl.appendChild(section(head, ofType, term, type));
      });
    } else {
      // Version headings also drop away once a version filter narrows the list — the card's
      // own version tag already says which release it came from.
      var headsHere = withHeadings && !state.versionFrom && !state.versionTo;
      var order = [];
      var byVersion = new Map();
      visible.forEach(function (i) {
        if (!byVersion.has(i.version)) { byVersion.set(i.version, []); order.push(i); }
        byVersion.get(i.version).push(i);
      });
      order.forEach(function (first) {
        var items = byVersion.get(first.version).slice().sort(function (a, b) {
          return TYPES.indexOf(a.entry.type) - TYPES.indexOf(b.entry.type);
        });
        var head = headsHere
          ? '<div class="group-head"><span class="ver">v' + escapeHtml(first.version) + "</span>" +
            (first.date ? '<span class="date">' + escapeHtml(first.date) + "</span>" : "") +
            '<span class="count">' + items.length + "</span></div>"
          : "";
        groupsEl.appendChild(section(head, items, term, null));
      });
    }

    setStatus(state.done ? "End of changelog" : "");
  }

  function setStatus(text) {
    statusEl.hidden = !text;
    statusEl.textContent = text || "";
  }

  async function fetchPage() {
    var params = new URLSearchParams();
    if (state.cursor) params.set("cursor", state.cursor);
    params.set("limit", PAGE_SIZE);
    if (state.search) params.set("search", state.search);
    if (state.versionFrom) params.set("versionFrom", state.versionFrom);
    if (state.versionTo) params.set("versionTo", state.versionTo);

    try {
      var res = await fetch(CHANGELOG_ENDPOINT + "?" + params.toString());
      if (!res.ok) throw new Error("bad response");
      return await res.json();
    } catch (err) {
      // Fallback to demo data (first page only) so the template renders standalone.
      if (state.cursor) return { releases: [], nextCursor: null };
      return { releases: DEMO_DATA.releases, nextCursor: null };
    }
  }

  function inRange(version) {
    if (!versionList.length) return true;
    var i = versionList.indexOf(version);
    if (i === -1) return true;
    if (state.versionFrom && i < versionList.indexOf(state.versionFrom)) return false;
    if (state.versionTo && i > versionList.indexOf(state.versionTo)) return false;
    return true;
  }

  async function loadMore() {
    if (state.loading || state.done) return;
    state.loading = true;
    if (!state.items.length) setStatus("Loading…");

    var page = await fetchPage();
    (page.releases || []).forEach(function (release) {
      if (!inRange(release.version)) return;
      (release.entries || []).forEach(function (entry) {
        state.items.push({ version: release.version, date: release.date, entry: entry });
      });
    });

    state.cursor = page.nextCursor || null;
    state.done = !state.cursor;
    state.loading = false;
    render();
  }

  function resetAndReload() {
    state.items = [];
    state.cursor = null;
    state.done = false;
    groupsEl.innerHTML = "";
    loadMore();
  }

  async function loadVersionOptions() {
    try {
      var res = await fetch(VERSIONS_ENDPOINT);
      if (!res.ok) throw new Error("bad response");
      versionList = (await res.json()).versions || [];
    } catch (err) {
      versionList = DEMO_DATA.versions;
    }
    [fromEl, toEl].forEach(function (sel) {
      sel.innerHTML = '<option value="">any</option>' +
        versionList.map(function (v) {
          return '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + "</option>";
        }).join("");
    });
  }

  // `toggle` doesn't bubble, so capture it on the container.
  groupsEl.addEventListener("toggle", function (ev) {
    var li = ev.target.closest("li.item");
    if (!li) return;
    if (ev.target.open) openKeys.add(li.dataset.key);
    else openKeys.delete(li.dataset.key);
  }, true);

  var searchTimer = null;
  searchEl.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.search = searchEl.value.trim();
      resetAndReload();
    }, SEARCH_DEBOUNCE_MS);
  });

  [fromEl, toEl].forEach(function (sel) {
    sel.addEventListener("change", function () {
      state.versionFrom = fromEl.value;
      state.versionTo = toEl.value;
      resetAndReload();
    });
  });

  sortBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (state.sort === btn.dataset.sort) return;
      state.sort = btn.dataset.sort;
      sortBtns.forEach(function (b) { b.setAttribute("aria-pressed", String(b === btn)); });
      render();   // regrouping only — no refetch needed
    });
  });

  new IntersectionObserver(function (entries) {
    if (entries[0].isIntersecting) loadMore();
  }, { rootMargin: "200px" }).observe(sentinelEl);

  loadVersionOptions().then(loadMore);
})();
</script>
