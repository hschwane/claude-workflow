<!--
  In-app changelog template (see ../preferences/changelog.md for the requirements this implements).

  Self-contained: no build step, no external dependencies, no webfonts. Drop into the app as its
  own page/view/route, then:
    1. Replace the CSS custom properties in the "APP THEME" block below with the app's own
       design tokens (colors, type stacks, radius) — that's the whole re-skin. The defaults here
       are a warm-paper palette with serif headings; swap them for the app's own.
    2. Point CHANGELOG_ENDPOINT / VERSIONS_ENDPOINT at the app's real backend routes (see the
       API CONTRACT comment below). Until then this renders the embedded DEMO_DATA so the page
       is inspectable standalone.
    3. Wire up navigation to/from wherever the app shows its version or update control.
-->
<title>Changelog</title>
<style>
  /* ---------------- APP THEME — replace these with the app's real tokens ---------------- */
  :root {
    --paper: #fbfaf7;
    --ink: #1c2a2c;
    --ink-soft: #495a5c;
    --ink-faint: #7d8a8a;
    --line: #e8e2d8;
    --card: #ffffff;
    --field: #f4f1ea;
    --accent: #d5622b;
    --accent-ink: #a8471c;
    --added: #3e7d5a;
    --changed: #b8842a;
    --fixed: #316d7b;
    --mark: #f6d99a;
    --mark-ink: #4a3208;
    --shadow: 0 1px 2px rgba(28, 42, 44, 0.04), 0 8px 28px rgba(28, 42, 44, 0.06);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101718; --ink: #ece6db; --ink-soft: #a6b1af; --ink-faint: #6c7978;
      --line: #24302e; --card: #17201e; --field: #1c2725;
      --accent: #ef7d40; --accent-ink: #f19563;
      --added: #71ba8d; --changed: #e0b25c; --fixed: #64aec0;
      --mark: #6a5217; --mark-ink: #f7e6bd;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="light"] {
    --paper: #fbfaf7; --ink: #1c2a2c; --ink-soft: #495a5c; --ink-faint: #7d8a8a;
    --line: #e8e2d8; --card: #ffffff; --field: #f4f1ea;
    --accent: #d5622b; --accent-ink: #a8471c;
    --added: #3e7d5a; --changed: #b8842a; --fixed: #316d7b;
    --mark: #f6d99a; --mark-ink: #4a3208;
    --shadow: 0 1px 2px rgba(28,42,44,.04), 0 8px 28px rgba(28,42,44,.06);
  }
  :root[data-theme="dark"] {
    --paper: #101718; --ink: #ece6db; --ink-soft: #a6b1af; --ink-faint: #6c7978;
    --line: #24302e; --card: #17201e; --field: #1c2725;
    --accent: #ef7d40; --accent-ink: #f19563;
    --added: #71ba8d; --changed: #e0b25c; --fixed: #64aec0;
    --mark: #6a5217; --mark-ink: #f7e6bd;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }

  /* ---------------- structure (adjust freely; the tokens above drive the look) ---------------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: clamp(1.75rem, 5vw, 3.5rem) clamp(1.15rem, 5vw, 2rem) 5rem;
  }

  /* Masthead */
  .brand {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: var(--mono);
    font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .brand .dot { color: var(--accent); font-size: 1rem; line-height: 0; }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(2rem, 6vw, 2.8rem);
    line-height: 1.08;
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0.9rem 0 0.55rem;
  }
  .lede { margin: 0; max-width: 58ch; font-size: 1.05rem; color: var(--ink-soft); }

  /* Controls */
  .controls {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; gap: 0.6rem;
    margin: 2rem 0 0;
    padding: 0.9rem 0;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .search {
    flex: 1 1 15rem; min-width: 0;
    padding: 0.5rem 0.8rem;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--field); color: var(--ink);
    font: inherit; font-size: 0.95rem;
  }
  .search::placeholder { color: var(--ink-faint); }
  .search:focus-visible, .range select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .range {
    display: flex; align-items: center; gap: 0.4rem;
    font-family: var(--mono); font-size: 0.72rem;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint);
  }
  .range select {
    padding: 0.4rem 0.5rem;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--field); color: var(--ink);
    font-family: var(--mono); font-size: 0.78rem;
    font-variant-numeric: tabular-nums;
    text-transform: none; letter-spacing: 0;
  }

  /* Release block */
  .release { margin: 2.6rem 0 0; }
  .release-head {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.55rem 0.9rem;
    margin-bottom: 1.2rem;
  }
  .release-head .ver {
    display: inline-flex; align-items: baseline;
    padding: 0.24rem 0.68rem;
    border: 1px solid var(--accent); border-radius: 999px;
    color: var(--accent-ink);
    font-family: var(--mono); font-size: 0.82rem; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .release-head .date {
    font-family: var(--mono); font-size: 0.78rem; color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  /* Category group inside a release */
  .group { margin: 0 0 1.6rem; }
  .group-head { display: flex; align-items: center; gap: 0.6rem; margin: 0 0 0.85rem; }
  .group-head .swatch {
    width: 0.62rem; height: 0.62rem; border-radius: 3px; flex: none;
    background: var(--gcol);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--gcol) 16%, transparent);
  }
  .group-head h2 {
    font-family: var(--serif); font-weight: 600; font-size: 1.2rem;
    letter-spacing: -0.005em; margin: 0;
  }
  .group-head .count {
    margin-left: auto;
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-faint);
  }

  ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.7rem; }
  li.item {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--gcol);
    border-radius: var(--radius);
    padding: 0.95rem 1.1rem;
    box-shadow: var(--shadow);
  }
  li.item p { margin: 0; font-size: 1rem; }
  li.item p .lead { font-weight: 600; color: var(--ink); }
  li.item mark { background: var(--mark); color: var(--mark-ink); border-radius: 3px; padding: 0 0.12em; }
  .tickets { margin-top: 0.6rem; display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .chip {
    font-family: var(--mono); font-size: 0.71rem; letter-spacing: 0.03em;
    padding: 0.16rem 0.5rem; border-radius: 6px; white-space: nowrap;
    color: var(--gcol);
    background: color-mix(in srgb, var(--gcol) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--gcol) 30%, transparent);
  }

  .status {
    margin: 2.5rem 0 0; text-align: center;
    font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .sentinel { height: 1px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<div class="wrap">
  <header>
    <span class="brand"><span class="dot">●</span> <span class="brand-name">Your app</span></span>
    <h1>Changelog</h1>
    <p class="lede">Everything that changed, newest first — searchable, and filterable down to a single release or a span of them.</p>
  </header>

  <div class="controls">
    <input class="search" type="search" placeholder="Search changes…" aria-label="Search changelog" />
    <div class="range">
      from <select class="version-from" aria-label="From version"></select>
      to <select class="version-to" aria-label="To version"></select>
    </div>
  </div>

  <div class="releases"></div>
  <p class="status" hidden></p>
  <div class="sentinel"></div>
</div>

<script>
(function () {
  "use strict";

  /* =========================================================================================
   * API CONTRACT — replace these two endpoints with the app's real backend routes.
   *
   * GET {VERSIONS_ENDPOINT}
   *   -> { "versions": ["1.0.0", "1.1.0", "1.2.0", ...] }   // ascending, used to fill the
   *      from/to <select> filters without loading every entry up front.
   *
   * GET {CHANGELOG_ENDPOINT}?cursor=<opaque|omit for first page>&limit=<n>
   *                          &search=<optional>&versionFrom=<optional>&versionTo=<optional>
   *   -> {
   *        "releases": [
   *          { "version": "1.4.0", "date": "2026-07-01", "entries": [
   *              { "type": "added" | "changed" | "fixed",
   *                "ticket": "FEAT-042",
   *                "lead": "Short bold headline.",   // optional
   *                "text": "The rest of the explanation." }
   *          ] }
   *        ],
   *        "nextCursor": "opaque-string-or-null"   // null/absent means no more pages
   *      }
   *   Releases are returned newest-first. Filtering/search happens server-side so pagination
   *   and bandwidth savings hold even with an active filter; the client re-filters and
   *   highlights locally so matches are visible without a second round trip.
   * ========================================================================================= */
  var CHANGELOG_ENDPOINT = "/api/changelog";
  var VERSIONS_ENDPOINT = "/api/changelog/versions";
  var PAGE_SIZE = 10;
  var SEARCH_DEBOUNCE_MS = 250;

  var TYPES = ["added", "changed", "fixed"];
  var TYPE_LABEL = { added: "Added", changed: "Changed", fixed: "Fixed" };
  var COUNT_NOUN = { added: ["new", "new"], changed: ["change", "changes"], fixed: ["fix", "fixes"] };

  // Demo data so the template is inspectable before the endpoints exist. Delete once wired up.
  var DEMO_DATA = {
    versions: ["1.0.0", "1.1.0", "1.2.0"],
    releases: [
      { version: "1.2.0", date: "2026-07-20", entries: [
        { type: "added", ticket: "FEAT-031", lead: "Offline map regions.",
          text: "Pre-download a named area or draw your own, with a size estimate before you start and a progress bar while it runs." },
        { type: "added", ticket: "FEAT-034", lead: "Data freshness at a glance.",
          text: "The map header shows when its data was last updated, with a refresh action when the server has something newer." },
        { type: "changed", ticket: "FEAT-028", lead: "Search ranks by distance first.",
          text: "Nearby results come before exact name matches, which is what you actually want while standing somewhere." },
        { type: "fixed", ticket: "BUG-014", lead: "Clustering no longer flickers.",
          text: "Markers were rebuilt on every zoom step instead of having their icons swapped; they now update in place." }
      ]},
      { version: "1.1.0", date: "2026-06-02", entries: [
        { type: "added", ticket: "FEAT-019", lead: "Dark mode everywhere.",
          text: "Every view follows your system theme, with a manual override in settings." },
        { type: "fixed", ticket: "BUG-009", lead: "Settings open offline again.",
          text: "The settings screen tried to read the remote config before falling back to the cached copy, and crashed when there was no connection." }
      ]},
      { version: "1.0.0", date: "2026-05-01", entries: [
        { type: "added", ticket: "FEAT-001", lead: "First release.",
          text: "Map, search, favourites, and offline support." }
      ]}
    ]
  };

  var releasesEl = document.querySelector(".releases");
  var statusEl = document.querySelector(".status");
  var sentinelEl = document.querySelector(".sentinel");
  var searchEl = document.querySelector(".search");
  var fromEl = document.querySelector(".version-from");
  var toEl = document.querySelector(".version-to");

  var state = { cursor: null, loading: false, done: false, search: "", versionFrom: "", versionTo: "", rendered: 0 };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function highlight(text, term) {
    var safe = escapeHtml(text);
    if (!term) return safe;
    var esc = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return safe.replace(new RegExp("(" + esc + ")", "ig"), "<mark>$1</mark>");
  }

  function matches(entry, term) {
    if (!term) return true;
    var hay = ((entry.lead || "") + " " + (entry.text || "") + " " + (entry.ticket || "")).toLowerCase();
    return hay.indexOf(term.toLowerCase()) !== -1;
  }

  function countLabel(type, n) {
    var noun = COUNT_NOUN[type] || ["item", "items"];
    return n + " " + (n === 1 ? noun[0] : noun[1]);
  }

  function renderEntry(entry, term) {
    return (
      '<li class="item">' +
        "<p>" +
          (entry.lead ? '<span class="lead">' + highlight(entry.lead, term) + "</span> " : "") +
          highlight(entry.text || "", term) +
        "</p>" +
        (entry.ticket ? '<div class="tickets"><span class="chip">' + highlight(entry.ticket, term) + "</span></div>" : "") +
      "</li>"
    );
  }

  function renderRelease(release, term) {
    var kept = (release.entries || []).filter(function (e) { return matches(e, term); });
    if (!kept.length) return null;

    var groups = TYPES.map(function (type) {
      var ofType = kept.filter(function (e) { return e.type === type; });
      if (!ofType.length) return "";
      return (
        '<div class="group" style="--gcol: var(--' + type + ')">' +
          '<div class="group-head">' +
            '<span class="swatch"></span>' +
            "<h2>" + TYPE_LABEL[type] + "</h2>" +
            '<span class="count">' + countLabel(type, ofType.length) + "</span>" +
          "</div>" +
          '<ul class="items">' + ofType.map(function (e) { return renderEntry(e, term); }).join("") + "</ul>" +
        "</div>"
      );
    }).join("");

    var section = document.createElement("section");
    section.className = "release";
    section.innerHTML =
      '<div class="release-head">' +
        '<span class="ver">v' + escapeHtml(release.version) + "</span>" +
        (release.date ? '<span class="date">' + escapeHtml(release.date) + "</span>" : "") +
      "</div>" + groups;
    return section;
  }

  function setStatus(text) {
    statusEl.hidden = !text;
    statusEl.textContent = text || "";
  }

  async function fetchPage() {
    var params = new URLSearchParams();
    if (state.cursor) params.set("cursor", state.cursor);
    params.set("limit", PAGE_SIZE);
    if (state.search) params.set("search", state.search);
    if (state.versionFrom) params.set("versionFrom", state.versionFrom);
    if (state.versionTo) params.set("versionTo", state.versionTo);

    try {
      var res = await fetch(CHANGELOG_ENDPOINT + "?" + params.toString());
      if (!res.ok) throw new Error("bad response");
      return await res.json();
    } catch (err) {
      // Fallback to demo data (first page only) so the template renders standalone.
      if (state.cursor) return { releases: [], nextCursor: null };
      return { releases: DEMO_DATA.releases, nextCursor: null };
    }
  }

  function inRange(version) {
    var all = versionList;
    if (!all.length) return true;
    var i = all.indexOf(version);
    if (i === -1) return true;
    if (state.versionFrom && i < all.indexOf(state.versionFrom)) return false;
    if (state.versionTo && i > all.indexOf(state.versionTo)) return false;
    return true;
  }

  async function loadMore() {
    if (state.loading || state.done) return;
    state.loading = true;
    if (!state.rendered) setStatus("Loading…");

    var page = await fetchPage();
    var term = state.search;

    (page.releases || []).forEach(function (release) {
      if (!inRange(release.version)) return;
      var el = renderRelease(release, term);
      if (el) { releasesEl.appendChild(el); state.rendered++; }
    });

    state.cursor = page.nextCursor || null;
    state.done = !state.cursor;
    state.loading = false;

    if (state.rendered === 0) setStatus(term || state.versionFrom || state.versionTo ? "No matching changes" : "Nothing here yet");
    else setStatus(state.done ? "End of changelog" : "");
  }

  function resetAndReload() {
    releasesEl.innerHTML = "";
    state.cursor = null;
    state.done = false;
    state.rendered = 0;
    loadMore();
  }

  var versionList = [];

  async function loadVersionOptions() {
    try {
      var res = await fetch(VERSIONS_ENDPOINT);
      if (!res.ok) throw new Error("bad response");
      versionList = (await res.json()).versions || [];
    } catch (err) {
      versionList = DEMO_DATA.versions;
    }
    [fromEl, toEl].forEach(function (sel) {
      sel.innerHTML = '<option value="">any</option>' +
        versionList.map(function (v) {
          return '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + "</option>";
        }).join("");
    });
  }

  var searchTimer = null;
  searchEl.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.search = searchEl.value.trim();
      resetAndReload();
    }, SEARCH_DEBOUNCE_MS);
  });

  [fromEl, toEl].forEach(function (sel) {
    sel.addEventListener("change", function () {
      state.versionFrom = fromEl.value;
      state.versionTo = toEl.value;
      resetAndReload();
    });
  });

  new IntersectionObserver(function (entries) {
    if (entries[0].isIntersecting) loadMore();
  }, { rootMargin: "200px" }).observe(sentinelEl);

  loadVersionOptions().then(loadMore);
})();
</script>
