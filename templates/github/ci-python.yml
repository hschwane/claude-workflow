# Thin wrapper around scripts/ci.sh — same checks Claude runs locally (parity).
# Claude's commits carry [skip ci] (native), so this runs on HUMAN commits + manual dispatch.
# Do NOT mark this a required status check: [skip ci] leaves required checks Pending forever.
name: CI
on:
  push:
    branches: {{CI_BRANCHES}}
    paths-ignore: ["docs/**", "**/*.md", ".claude/**"]
  pull_request:
    branches: {{CI_BRANCHES}}   # the PR TARGET branch, not the source — gate before the human merges
    paths-ignore: ["docs/**", "**/*.md", ".claude/**"]
  workflow_dispatch:
permissions:
  contents: read      # the gate only reads the repo; nothing here needs write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # scripts/ci.sh drives every stage through `uv run`, so uv has to exist here.
      # `--locked` is what makes uv.lock load-bearing: CI installs exactly what was
      # committed, and fails loudly if the lockfile is stale.
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --locked
      - run: bash scripts/ci.sh full
