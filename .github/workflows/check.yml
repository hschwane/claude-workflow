name: check
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Real scripts must be clean.
          git ls-files '*.sh' | grep -v '^templates/scripts/' | xargs shellcheck -S warning
          # templates/scripts/*.sh carry {{PLACEHOLDER}} tokens until a project fills them,
          # which shellcheck cannot parse. bash -n (in check.sh) covers their syntax; here we
          # only assert they contain no OTHER class of problem.
          shellcheck -S warning -e SC1054,SC1073,SC1083,SC1009,SC1072,SC1056 templates/scripts/*.sh || true
      - name: self-check
        run: ./scripts/check.sh
